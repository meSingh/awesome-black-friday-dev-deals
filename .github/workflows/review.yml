name: Review submissions

# Reviews one pull request: the one this run belongs to. Each pull request gets its own run, so
# many are reviewed at the same time and each shows its own check. The check is green only
# when the deal has passed; when something needs fixing or a person has to look, it is red and
# the reply on the pull request says why.
#
# This workflow never merges and never writes to the list. Publishing is a separate workflow
# (publish.yml), which merges only pull requests whose review here has passed.
on:
  # pull_request_target runs this workflow from main, with a token that can write, for pull
  # requests from forks. That is safe here only because nothing from the pull request is ever
  # checked out or executed: the job checks out main, and reads the submitted file as text
  # through the API. Do not add a step that checks out or runs the pull request's code.
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

# Nothing by default; the job asks for what it needs.
permissions: {}

# Runs for different pull requests do not wait for each other. Runs for the same pull request
# go one after another, each to the end, so the newest one has the last word.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  # publish.yml looks for this job's name, "review", on the commit before it merges.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the rules still pass
        run: node --test test/*.test.mjs
      - name: Review this pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ACTIONS: ${{ runner.temp }}/review-actions.json
          REVIEW_STAGE: review
          REVIEW_PR: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/review.mjs decide
      # Labels and replies. This step fails unless the deal was approved, which is what turns
      # the pull request's check green or red.
      - name: Say how it went
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ACTIONS: ${{ runner.temp }}/review-actions.json
        run: node scripts/review.mjs verdict
