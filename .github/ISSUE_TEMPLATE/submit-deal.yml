name: Submit a deal
description: Add a Black Friday 2026 deal. It is free, and most deals go live within the hour.
title: "Deal: "
labels: ["deal-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding a deal. Fill in every field; if anything needs fixing, you will get a reply right here on the issue.
        This list is for software and tools that developers, founders and AI builders use: developer tools, AI, SaaS, hosting, courses and books.
        Not accepted: general retail (clothing, watches, beauty, household goods), gambling, adult content, crypto schemes, shortened links and affiliate links. Please link the seller's own page.
  - type: input
    id: name
    attributes:
      label: Product name
      placeholder: Acme CLI
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Deal URL
      description: The seller's own page, starting with https://. No shortened links and no affiliate or referral links, please.
      placeholder: https://acme.dev/black-friday
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick by what the product does.
      options:
        - AI tools
        - AI video, image and voice
        - Developer tools
        - Hosting and cloud
        - Databases and backend
        - Email
        - Design and UI
        - Starter kits
        - SEO and marketing
        - Courses and books
        - Productivity
        - Mac and desktop apps
        - Security
        - Other
    validations:
      required: true
  - type: input
    id: discount
    attributes:
      label: Discount
      description: Short and specific, 60 characters or fewer.
      placeholder: 40% off annual plans
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Coupon code
      description: Leave empty if the discount applies without a code.
      placeholder: BF26
  - type: input
    id: starts
    attributes:
      label: Start date
      description: YYYY-MM-DD
      placeholder: "2026-11-27"
    validations:
      required: true
  - type: input
    id: ends
    attributes:
      label: End date
      description: YYYY-MM-DD. Leave it empty if the deal has no end date. Deals that run on into December are welcome.
      placeholder: "2026-12-04"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What is it
      description: One plain sentence on what the product is, 160 characters or fewer. No sales copy.
      placeholder: A command line tool that deploys containers to your own servers.
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image link
      description: Optional. A link to your own banner or social image (png, jpg or webp, up to 5 MB, starting with https://). It is shown next to your deal on dev.express. Leave it empty and we will use the social image from your page.
      placeholder: https://acme.dev/og/black-friday.png
  - type: input
    id: logo
    attributes:
      label: Logo link
      description: Optional. A link to your product's logo or app icon, square, at least 128 pixels wide (png, jpg or webp, starting with https://). Leave it empty and we will use the icon your site already declares.
      placeholder: https://acme.dev/icon.png
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the product
      options:
        - I built it or work on it
        - I am a customer or user
        - I found it and have no relation to it
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: The deal is real, public and stated on the page I linked.
          required: true
